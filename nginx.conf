# ══════════════════════════════════════════════════
# Odyssey — dış kabuk
# ──────────────────────────────────────────────────
# Bu dosya /etc/nginx/templates/default.conf.template olarak kopyalanır;
# nginx'in resmi entrypoint'i başlangıçta envsubst ile ${BACKEND_HOST} ve
# ${KAPASITE_HOST} değişkenlerini gerçek adreslerle doldurur (bkz. Dockerfile).
#
# NEDEN PROXY?
# Odyssey giriş ekranını taşıyor ve oturum çerezini KENDİ origin'ine yazıyor.
# Alt uygulamalar iframe içinde başka bir *.up.railway.app alt alan adından
# gelseydi tarayıcı onları "üçüncü taraf" sayıp çerezi göndermezdi ve uygulama
# iframe içinde sürekli login'e düşerdi. Bu yüzden hem API hem de PO Sprint
# Sunumu Hazırlayıcı arayüzü AYNI origin üzerinden, buradan servis edilir.
# Ayrı bir API gateway servisi yok - tek bir nginx yeterli.
# ══════════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Excel/asset yüklemeleri (varsayılan 1m yetmiyor) ve uzun süren
    # PPTX üretimi / Jira senkronizasyonu için cömert sınırlar.
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Upstream adresleri PUBLIC Railway alan adları: Odyssey ayrı bir Railway
    # projesinde olduğu için private network (railway.internal) erişimi yok.
    # proxy_pass'te değişken kullanıldığından nginx'in çalışma anında DNS
    # çözebilmesi gerekir - literal adres yazılsaydı IP yalnızca başlangıçta
    # çözülür ve Railway edge IP'si değişince proxy sessizce bozulurdu.
    resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;

    # ── Kimlik doğrulama: ayrı auth servisi ──
    # Kullanıcılar ve oturum artık Capacity Planner backend'inde değil, dış
    # katmandaki odyssey-auth servisinde (kendi Postgres'iyle birlikte).
    # nginx'te en uzun eşleşen önek kazandığı için bu blok aşağıdaki /api/
    # bloğundan önce devreye girer.
    location /api/auth/ {
        set $auth_ust "${AUTH_HOST}";
        proxy_pass https://$auth_ust$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $auth_ust;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ── Geri kalan backend API'si (Capacity Planner) ──
    # Çerezler bu isteğe Odyssey origin'i için yazılır (Set-Cookie'de Domain
    # yok), yani first-party kalır; iki servis de aynı çerezi görür.
    location /api/ {
        set $api_ust "${BACKEND_HOST}";
        proxy_pass https://$api_ust$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $api_ust;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ── PO Sprint Sunumu Hazırlayıcı (eski adıyla Capacity Planner) ──
    # /kapasite/... → alt uygulamanın kökü. Uygulama Vite tarafında
    # base="/kapasite/" ile derlendiği için varlık adresleri de bu önekle
    # gelir ve buradan doğru şekilde geriye eşlenir.
    location = /kapasite {
        return 301 /kapasite/;
    }
    location /kapasite/ {
        set $kapasite_ust "${KAPASITE_HOST}";
        rewrite ^/kapasite/(.*)$ /$1 break;
        proxy_pass https://$kapasite_ust;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $kapasite_ust;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Alt uygulama kendi köküne yönlendirme yaparsa önek korunsun.
        proxy_redirect ~^https?://[^/]+/(.*)$ /kapasite/$1;
    }

    # ── Odyssey'in kendi statik dosyaları + rota geri dönüşü ──
    # /uygulama/<slug> gibi rotalar sunucuda dosya karşılığı olmadığı için
    # index.html'e düşer; rotayı shell.js çözer (geri tuşu bu sayede çalışır).
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
