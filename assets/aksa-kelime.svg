<!--
  AKSA kelime markası — kurumsal kilit logonun (aksa-dogalgaz.svg) YALNIZ
  "aksa" harfleri. Kilidin mavi/yeşil zemini, siyah kutusu ve "DOĞALGAZ"
  satırı bilerek dışarıda.

  Neden ayrı bir dosya: kilit logo OPAK zeminli. Posterin filigranı olarak
  basılırsa arkasındaki içeriği kapatır, küçük imza boyutunda ise renk
  blokları okunmaz hâle gelir. Bu iki yerde markanın tanınırlığını taşıyan
  şey harflerin kendisi, o yüzden yalnız onlar alındı.

  Dolgu currentColor: filigran posterin mürekkebini (var(--ink)), imza da
  var(--muted)'i alsın diye — böylece altı palet ve açık/koyu modun hepsiyle
  uyumlu kalıyor, kilit logonun sabit mavisi paletle çakışmıyor.

  viewBox, harflerin gerçek sınırlarına oturtuldu (kilitteki 0 0 595.27
  180.21 kutusunun x 148.85..446.42 / y 59.9..120.3 bölgesi). Orijinaldeki
  clipPath alınmadı: harfler zaten kutunun içinde kalıyor ve id çakışması
  (aynı sayfaya iki kez gömülüyor) böylece hiç doğmuyor.
-->
