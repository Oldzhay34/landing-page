spring:
  application:
    name: odyssey-auth
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:odyssey_auth}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Sema Flyway ile yonetiliyor; Hibernate tabloya dokunmasin.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8081}

app:
  jwt:
    # Capacity Planner backend'i AYNI degeri kullanmali - token'i o dogruluyor.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    access-token-ttl-minutes: ${APP_JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${APP_JWT_REFRESH_TTL_DAYS:7}
    cookie-secure: ${APP_JWT_COOKIE_SECURE:false}
    # Odyssey her seyi kendi origin'i uzerinden proxy'ledigi icin istekler
    # tarayici acisindan same-site; None'a gerek yok (bkz. Odyssey nginx.conf).
    same-site: ${APP_JWT_SAME_SITE:Lax}
  cors:
    # Odyssey kabugunun alan adi: proxy, tarayicinin gonderdigi Origin
    # basligini oldugu gibi iletiyor - listede olmazsa POST /api/auth/login
    # 403 doner (bkz. Odyssey README).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:5173,http://localhost:5174}

logging:
  level:
    org.flywaydb: INFO
